  <!-- v1.5.0.3 — additive print override; does not alter stock/payment ledgers -->
  <style id="ww-print-v1503-style">
    .wwp1503-backdrop{
      position:fixed;inset:0;z-index:99999;background:rgba(17,17,17,.48);
      display:flex;align-items:flex-end;justify-content:center;padding:0;
    }
    .wwp1503-sheet{
      width:min(680px,100%);max-height:94vh;overflow:auto;background:#fff;
      border-radius:22px 22px 0 0;padding:14px 14px 26px;
      box-shadow:0 -20px 60px rgba(0,0,0,.22);color:#171717;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .wwp1503-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .wwp1503-head h3{margin:0;font-size:17px}
    .wwp1503-close{border:0;background:#f1efed;width:38px;height:38px;border-radius:12px;font-size:23px}
    .wwp1503-note{padding:11px 12px;border-radius:13px;background:#fff3e6;font-size:12px;line-height:1.45;margin-bottom:11px}
    .wwp1503-field{display:grid;gap:6px;margin:10px 0;font-size:12px}
    .wwp1503-field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font:inherit}
    .wwp1503-preview{
      margin:10px 0 12px;padding:12px;background:#171717;color:#fff;border-radius:13px;
      white-space:pre-wrap;overflow:auto;font:12px/1.42 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .wwp1503-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .wwp1503-btn{border:0;border-radius:12px;padding:12px;font-weight:800;font-size:12px}
    .wwp1503-btn.soft{background:#f1efed;color:#171717}
    .wwp1503-btn.red{background:#d41414;color:#fff}
    .wwp1503-loading{padding:30px 12px;text-align:center;font-size:13px;color:#666}
    .wwp1503-error{padding:14px;background:#fff0f0;border-radius:12px;color:#9f0e13;font-size:12px;line-height:1.5}
    @media(max-width:420px){.wwp1503-sheet{border-radius:18px 18px 0 0}.wwp1503-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <!--
    WILLS WAREHOUSE v1.5.0.3
    Drop-in print override for current GitHub PWA.
    Read-only: only calls getDeliveryPrintDataV1500.
  -->
  <script id="ww-print-v1503">
  (() => {
    'use strict';

    const VERSION = '1.5.0.3';
    const TOKEN_KEY = 'ww_github_token_v1';

    function money(v){
      return 'Rp' + new Intl.NumberFormat('id-ID',{
        maximumFractionDigits:0
      }).format(Number(v||0));
    }

    function num(v){
      return new Intl.NumberFormat('id-ID',{
        maximumFractionDigits:2
      }).format(Number(v||0));
    }

    function wrap(text,width){
      const words=String(text||'')
        .replace(/\s+/g,' ')
        .trim()
        .split(' ')
        .filter(Boolean);

      const out=[];
      let line='';

      words.forEach(word=>{
        if(!line) line=word;
        else if((line+' '+word).length<=width) line+=' '+word;
        else{
          out.push(line);
          line=word;
        }
      });

      if(line) out.push(line);
      return out.length?out:[''];
    }

    function center(text,width){
      const t=String(text||'').slice(0,width);
      const left=Math.max(0,Math.floor((width-t.length)/2));
      return ' '.repeat(left)+t;
    }

    function sanitizeThermal(value){
      return String(value==null?'':value)
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/[^\x20-\x7E\n\r]/g,' ')
        .replace(/\r/g,'');
    }

    function thermalText(pd,width){
      width=Number(width)===48?48:32;

      const hr='-'.repeat(width);
      const out=[];
      const sj=pd.sj||{};
      const bill=pd.billing||{};
      const lines=pd.lines||[];

      const totalFromLines=lines.reduce(
        (sum,x)=>sum+Number(x.lineTotal||0),
        0
      );

      const totalTagihan=
        Number(bill.totalTagihan||0)>0
          ? Number(bill.totalTagihan)
          : totalFromLines;

      const paid=Number(bill.paid||0);

      const outstanding=Number(
        bill.outstanding!=null
          ? bill.outstanding
          : Math.max(0,totalTagihan-paid)
      );

      const payStatus=String(
        bill.paymentStatus||'BELUM LUNAS'
      ).toUpperCase();

      const isPaid=payStatus==='LUNAS';

      out.push(center('WILLS COFFEE',width));
      out.push(center('SURAT JALAN',width));
      out.push(center('PRINT v'+VERSION,width));
      out.push(hr);

      wrap('No SJ: '+(sj.noSj||'-'),width)
        .forEach(x=>out.push(x));

      wrap('Outlet: '+(sj.outletName||'-'),width)
        .forEach(x=>out.push(x));

      wrap('Status Barang: '+(sj.status||'-'),width)
        .forEach(x=>out.push(x));

      if(sj.shipDate){
        wrap('Tanggal Kirim: '+sj.shipDate,width)
          .forEach(x=>out.push(x));
      }

      wrap(
        'Dicetak: '+
        new Intl.DateTimeFormat(
          'id-ID',
          {dateStyle:'short',timeStyle:'short'}
        ).format(new Date()),
        width
      ).forEach(x=>out.push(x));

      out.push(hr);
      out.push(center('TAGIHAN OUTLET',width));

      wrap(
        'TOTAL TAGIHAN: '+money(totalTagihan),
        width
      ).forEach(x=>out.push(x));

      wrap(
        'STATUS PEMBAYARAN: '+payStatus,
        width
      ).forEach(x=>out.push(x));

      if(paid>0){
        wrap(
          'SUDAH DIBAYAR: '+money(paid),
          width
        ).forEach(x=>out.push(x));
      }

      if(outstanding>0){
        wrap(
          'SISA PIUTANG: '+money(outstanding),
          width
        ).forEach(x=>out.push(x));
      }

      out.push(isPaid?'[X] LUNAS':'[ ] LUNAS');
      out.push(isPaid?'[ ] BELUM LUNAS':'[X] BELUM LUNAS');

      if(payStatus==='BAYAR SEBAGIAN'){
        wrap('KETERANGAN: BAYAR SEBAGIAN',width)
          .forEach(x=>out.push(x));
      }

      out.push(hr);
      out.push(center('DAFTAR BAHAN',width));

      lines.forEach((line,i)=>{
        wrap(
          '[ ] '+(i+1)+'. '+(line.name||'-'),
          width
        ).forEach(x=>out.push(x));

        wrap(
          '    '+num(line.qty)+' '+(line.unit||'')+
          ' x '+money(line.unitPrice),
          width
        ).forEach(x=>out.push(x));

        wrap(
          '    Jumlah: '+money(line.lineTotal),
          width
        ).forEach(x=>out.push(x));

        out.push('');
      });

      out.push(hr);

      wrap(
        'TOTAL TAGIHAN: '+money(totalTagihan),
        width
      ).forEach(x=>out.push(x));

      wrap(
        'STATUS: '+payStatus,
        width
      ).forEach(x=>out.push(x));

      out.push('');
      out.push('VERIFIKASI LUNAS');
      out.push('Nama: ______________________');
      out.push('TTD : ______________________');
      out.push('Tgl : ______________________');

      wrap(
        'TTD hanya diisi setelah pembayaran diverifikasi Warehouse/Finance.',
        width
      ).forEach(x=>out.push(x));

      out.push(hr);
      out.push('CHECK GUDANG');
      out.push('[ ] Jumlah sesuai');
      out.push('[ ] Kondisi bahan baik');
      out.push('[ ] Sudah dimuat/dibawa');

      out.push('');
      out.push('CHECK BARISTA OUTLET');
      out.push('[ ] Nama bahan sesuai');
      out.push('[ ] Jumlah diterima sesuai');
      out.push('[ ] Kondisi bahan baik');
      out.push('Nama: ______________________');
      out.push('Paraf: _____________________');

      out.push(hr);

      wrap(
        'Status barang dan pembayaran terpisah. SELESAI tidak otomatis berarti LUNAS.',
        width
      ).forEach(x=>out.push(x));

      if(sj.note){
        out.push(hr);
        wrap('Catatan: '+sj.note,width)
          .forEach(x=>out.push(x));
      }

      out.push('');
      out.push('');

      return out.join('\n');
    }

    function rawBt(text){
      const clean=sanitizeThermal(
        String(text||'')+'\n\n\n'
      );

      const bytes=new TextEncoder().encode(clean);

      let binary='';
      const chunk=0x8000;

      for(let i=0;i<bytes.length;i+=chunk){
        binary+=String.fromCharCode.apply(
          null,
          bytes.subarray(
            i,
            Math.min(i+chunk,bytes.length)
          )
        );
      }

      const base64=btoa(binary);

      let frame=document.getElementById(
        'wwRawBtPrintV1503'
      );

      if(!frame){
        frame=document.createElement('iframe');
        frame.id='wwRawBtPrintV1503';
        frame.style.cssText=
          'display:none;width:0;height:0;border:0';
        document.body.appendChild(frame);
      }

      frame.src='about:blank';

      setTimeout(()=>{
        frame.src='rawbt:base64,'+base64;
      },20);

      setTimeout(()=>{
        try{
          frame.src='about:blank';
          window.focus();
        }catch(_){}
      },1400);
    }

    function browserPrint(text,width){
      const win=window.open(
        '',
        '_blank',
        'width=420,height=720'
      );

      if(!win){
        alert('Popup print diblokir browser.');
        return;
      }

      const mm=Number(width)===48?'80mm':'58mm';

      const safe=String(text||'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');

      win.document.write(
        '<!doctype html>'+
        '<html><head>'+
        '<meta charset="utf-8">'+
        '<title>Surat Jalan Wills</title>'+
        '<style>'+
        '@page{size:'+mm+' auto;margin:3mm}'+
        'body{margin:0;font:12px/1.35 monospace;color:#000}'+
        'pre{white-space:pre-wrap;margin:0}'+
        '</style>'+
        '</head><body><pre>'+
        safe+
        '</pre></body></html>'
      );

      win.document.close();
      win.focus();

      setTimeout(()=>win.print(),120);
    }

    function currentDeliveryId(button){
      if(button && button.dataset.printSjid){
        return String(button.dataset.printSjid||'');
      }

      const detail=document.querySelector(
        '#sheetRoot .sheet-backdrop[data-sheet-key^="delivery-detail:"]'
      );

      if(detail){
        return String(detail.dataset.sheetKey||'')
          .replace(/^delivery-detail:/,'');
      }

      return '';
    }

    function closeOverlay(overlay,previous){
      if(overlay && overlay.parentNode){
        overlay.parentNode.removeChild(overlay);
      }

      if(previous){
        previous.style.display='';
      }
    }

    function buildOverlay(previous){
      const overlay=document.createElement('div');
      overlay.className='wwp1503-backdrop';
      overlay.innerHTML=
        '<div class="wwp1503-sheet">'+
          '<div class="wwp1503-head">'+
            '<h3>Cetak Thermal v'+VERSION+'</h3>'+
            '<button class="wwp1503-close" type="button" aria-label="Tutup">×</button>'+
          '</div>'+
          '<div class="wwp1503-loading">Memuat total tagihan dan status pembayaran…</div>'+
        '</div>';

      document.body.appendChild(overlay);

      overlay.querySelector('.wwp1503-close')
        .addEventListener('click',()=>{
          closeOverlay(overlay,previous);
        });

      overlay.addEventListener('click',e=>{
        if(e.target===overlay){
          closeOverlay(overlay,previous);
        }
      });

      return overlay;
    }

    async function openPrint(sjId){
      if(!sjId){
        throw new Error(
          'SJ tidak dapat diidentifikasi.'
        );
      }

      const token=String(
        localStorage.getItem(TOKEN_KEY)||''
      );

      if(!token){
        throw new Error(
          'Sesi Warehouse tidak ditemukan. Login kembali.'
        );
      }

      if(!window.WILLS_BRIDGE){
        throw new Error(
          'Bridge Warehouse belum tersedia.'
        );
      }

      const root=document.getElementById('sheetRoot');
      const previous=root?root.firstElementChild:null;

      if(previous){
        previous.style.display='none';
      }

      const overlay=buildOverlay(previous);

      try{
        const pd=await window.WILLS_BRIDGE.call(
          'getDeliveryPrintDataV1500',
          token,
          sjId
        );

        if(!pd || pd.ok===false){
          throw new Error(
            (pd&&pd.message)||
            'Data cetak v1.5 tidak tersedia.'
          );
        }

        let width=Number(
          localStorage.getItem(
            'ww_thermal_width'
          )||32
        );

        if(width!==48) width=32;

        const sheet=overlay.querySelector(
          '.wwp1503-sheet'
        );

        sheet.innerHTML=
          '<div class="wwp1503-head">'+
            '<h3>Cetak Thermal v'+VERSION+'</h3>'+
            '<button class="wwp1503-close" type="button" aria-label="Tutup">×</button>'+
          '</div>'+
          '<div class="wwp1503-note">'+
            '<b>Preview v'+VERSION+'</b><br>'+
            'Pastikan terlihat TOTAL TAGIHAN dan STATUS PEMBAYARAN sebelum mencetak.'+
          '</div>'+
          '<label class="wwp1503-field">'+
            '<span>Lebar printer</span>'+
            '<select id="wwp1503Width">'+
              '<option value="32" '+(width===32?'selected':'')+'>58 mm · 32 karakter</option>'+
              '<option value="48" '+(width===48?'selected':'')+'>80 mm · 48 karakter</option>'+
            '</select>'+
          '</label>'+
          '<pre class="wwp1503-preview" id="wwp1503Preview"></pre>'+
          '<div class="wwp1503-actions">'+
            '<button class="wwp1503-btn soft" id="wwp1503System" type="button">Print Sistem</button>'+
            '<button class="wwp1503-btn red" id="wwp1503Rawbt" type="button">Cetak Bluetooth (RawBT)</button>'+
          '</div>';

        const select=sheet.querySelector(
          '#wwp1503Width'
        );

        const preview=sheet.querySelector(
          '#wwp1503Preview'
        );

        const update=()=>{
          const w=
            Number(select.value)===48
              ? 48
              : 32;

          localStorage.setItem(
            'ww_thermal_width',
            String(w)
          );

          preview.textContent=
            thermalText(pd,w);

          return preview.textContent;
        };

        select.addEventListener(
          'change',
          update
        );

        update();

        sheet.querySelector(
          '.wwp1503-close'
        ).addEventListener('click',()=>{
          closeOverlay(overlay,previous);
        });

        sheet.querySelector(
          '#wwp1503System'
        ).addEventListener('click',()=>{
          browserPrint(
            update(),
            Number(select.value)
          );
        });

        sheet.querySelector(
          '#wwp1503Rawbt'
        ).addEventListener('click',()=>{
          rawBt(update());
        });

      }catch(err){
        const sheet=overlay.querySelector(
          '.wwp1503-sheet'
        );

        sheet.innerHTML=
          '<div class="wwp1503-head">'+
            '<h3>Cetak Thermal v'+VERSION+'</h3>'+
            '<button class="wwp1503-close" type="button" aria-label="Tutup">×</button>'+
          '</div>'+
          '<div class="wwp1503-error">'+
            '<b>Data cetak belum bisa dimuat.</b><br>'+
            String(err&&err.message||err)+
          '</div>';

        sheet.querySelector(
          '.wwp1503-close'
        ).addEventListener('click',()=>{
          closeOverlay(overlay,previous);
        });
      }
    }

    document.addEventListener(
      'click',
      event=>{
        const target=event.target &&
          event.target.closest
          ? event.target.closest(
              '[data-print-sjid], #ghPrintSj'
            )
          : null;

        if(!target) return;

        const sjId=currentDeliveryId(target);

        if(!sjId) return;

        // Stop template print lama sebelum onclick app.js berjalan.
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        openPrint(sjId).catch(err=>{
          alert(
            'Cetak SJ gagal: '+
            (err&&err.message||err)
          );
        });
      },
      true
    );

    console.info(
      '[Wills Warehouse] SJ payment print override active v'+VERSION
    );
  })();
  </script>
