name: Warehouse frontend safety

on:
  pull_request:
    paths:
      - 'app.js'
      - 'bridge.js'
      - 'config.js'
      - 'sw.js'
      - 'feature-v1370.js'
      - 'wills-ui-v41.js'
      - 'tests/**'
      - '.github/workflows/warehouse-frontend-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check frontend scripts
        run: |
          node --check app.js
          node --check bridge.js
          node --check config.js
          node --check sw.js
          node --check feature-v1370.js
          node --check wills-ui-v41.js
      - name: Guard regression tests
        run: node --test tests/*.test.cjs
